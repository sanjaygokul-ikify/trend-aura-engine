# pyproject.toml file

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aura-engine"
description = "A distributed autonomous reasoning engine"
version = "1.0.0"
authors = ["AURA Engine Team"]

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.25"
pandas = "^1.3"
numpy = "^1.20"

[tool.poetry.dev-dependencies]
pytest = "^6.2"
black = "^21.9"
flake8 = "^4.0"